name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: PHP syntax
        run: |
          find . -maxdepth 2 -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Existing upstream tests
        run: php tests.php

      - name: Amazon input smoke tests
        run: |
          short_output=$(php -r '$_SERVER["REQUEST_METHOD"]="POST"; $_SERVER["REQUEST_URI"]="/"; $_SERVER["HTTP_HOST"]="localhost"; $_POST["url"]="https://link.amazon/B08NZwPCe"; include "index.php";')
          echo "$short_output" | grep -F 'amazon?url=https%3A%2F%2Flink.amazon%2FB08NZwPCe'

          long_url='https://www.amazon.de/example/dp/B09V36WL6H?linkCode=ll2&tag=googl0ff-21&linkId=0865438b1b882167c769f37b9a8ab2f5&ref_=as_li_ss_tl'
          long_output=$(AMAZON_TEST_URL="$long_url" php -r '$_SERVER["REQUEST_METHOD"]="POST"; $_SERVER["REQUEST_URI"]="/"; $_SERVER["HTTP_HOST"]="localhost"; $_POST["url"]=getenv("AMAZON_TEST_URL"); include "index.php";')
          echo "$long_output" | grep -F 'tag%3Dgoogl0ff-21'
          echo "$long_output" | grep -F 'linkId%3D0865438b1b882167c769f37b9a8ab2f5'

      - name: Validate Dockerfile can build
        run: docker build -t justopen-smartlinks:test .
