captainVersion: 4
services:
  $$cap_appname:
    image: ghcr.io/tylonhh/justopen.app:$$cap_image_tag
    restart: always
    volumes:
      - $$cap_appname-data:/var/lib/justopen
    environment:
      JUSTOPEN_BASE_URL: $$cap_base_url
      JUSTOPEN_ADMIN_PASSWORD: $$cap_admin_password
      JUSTOPEN_DATA_DIR: /var/lib/justopen
    caproverExtra:
      containerHttpPort: '80'

caproverOneClickApp:
  variables:
    - id: $$cap_image_tag
      label: Reviewed image tag
      defaultValue: latest
      description: Publish this implementation first; use a reviewed sha-* tag for deployment.
      validRegex: /^([^\s^\/])+$/
    - id: $$cap_base_url
      label: Public HTTPS origin
      defaultValue: https://$$cap_appname.$$cap_root_domain
      description: Exact public origin without path or trailing slash.
      validRegex: /^https:\/\/[^\s\/]+$/
    - id: $$cap_admin_password
      label: Admin password
      defaultValue: $$cap_gen_random_hex(24)
      description: Save in your password manager. At least 12 characters.
      validRegex: /^.{12,}$/
  instructions:
    start: |-
      Deploy justopen Link Studio with persistent website links, UTM,
      customizable two-button pages, and a private editor.
      Publish the reviewed implementation to GHCR before installing.
      Use one replica and retain the data volume during updates.
    end: |-
      Enable HTTPS and Force HTTPS, then open:
      $$cap_base_url/admin

      Log in with the configured password, create a link, and test it from
      Instagram DMs on current iOS and Android devices.
      External opening is an attempt, not a guarantee across all devices.

      Backup and rollback notes:
      https://github.com/TylonHH/justopen.app/blob/main/CAPROVER.md
  displayName: justopen Link Studio
  isOfficial: false
  description: Custom landing pages, external-browser handoff, UTM and private link management.
  documentation: https://github.com/TylonHH/justopen.app/blob/main/CAPROVER.md
