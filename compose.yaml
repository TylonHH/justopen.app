services:
  justopen:
    build: .
    ports:
      - "127.0.0.1:8088:80"
    environment:
      JUSTOPEN_BASE_URL: ${JUSTOPEN_BASE_URL:-http://localhost:8088}
      JUSTOPEN_ADMIN_PASSWORD: ${JUSTOPEN_ADMIN_PASSWORD:-}
      JUSTOPEN_ADMIN_PASSWORD_HASH: ${JUSTOPEN_ADMIN_PASSWORD_HASH:-}
    volumes:
      - justopen-data:/var/lib/justopen
    restart: unless-stopped

volumes:
  justopen-data:
